# PostgreSQL for player accounts, stats and match history. Only reachable inside the cluster.
# Password comes from the accounts-secrets Secret (created on the server, see accounts-api.yaml).
# Tuned small: the whole stack shares a 2 GB server.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          args: ["-c", "shared_buffers=32MB", "-c", "max_connections=20", "-c", "work_mem=2MB"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: heretoslay
            - name: POSTGRES_USER
              value: heretoslay
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: accounts-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 192Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "heretoslay", "-d", "heretoslay"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "heretoslay", "-d", "heretoslay"]
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
