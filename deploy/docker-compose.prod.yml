# Production stack for the small game server (1 vCPU, 2 GB): one Kafka broker and one
# container per service, with capped memory. Run from the deploy folder on the server:
#   docker build -t heretoslay-backend -f Dockerfile.runtime . && docker compose -f docker-compose.prod.yml up -d
# Nothing is reachable from the internet directly: the server's own nginx serves the web
# client and forwards the game WebSocket to the load balancer on 127.0.0.1:8889.
# The image is built once by deploy.sh (docker build -t heretoslay-backend -f Dockerfile.runtime .).
x-backend: &backend
  image: heretoslay-backend
  restart: unless-stopped
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka-broker-1:29092
    JAVA_TOOL_OPTIONS: "-Xmx160m -Xss512k -XX:+UseSerialGC"
  depends_on:
    kafka-init:
      condition: service_completed_successfully
  networks:
    - kafka-network

services:
  kafka-broker-1:
    image: apache/kafka:3.7.0
    container_name: kafka-broker-1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker-1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker-1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx320m"
    networks:
      - kafka-network

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: kafka-init
    depends_on:
      - kafka-broker-1
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        B=kafka-broker-1:29092
        T=/opt/kafka/bin/kafka-topics.sh
        until $$T --bootstrap-server $$B --list >/dev/null 2>&1; do echo 'Aguardando Kafka...'; sleep 2; done
        for t in lobby-actions-in lobby-state-out game-actions-in game-state-out game-monitoring-alerts; do
          $$T --bootstrap-server $$B --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
        done
        for t in lobby-state-store match-state-store; do
          $$T --bootstrap-server $$B --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1 --config cleanup.policy=compact
        done
        echo 'Tópicos prontos.'
    networks:
      - kafka-network

  game-engine:
    <<: *backend
    command: ["org.br.heretoslay.match.EngineApplication"]

  gateway:
    <<: *backend
    command: ["org.br.heretoslay.HereToSlay"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker-1:29092
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xss512k -XX:+UseSerialGC"
      # Oldest client allowed in; older ones are asked to download the latest. Raise it with a release
      # (package.json "version"). Clients built before the check send no version and count as 0.0.0.
      MIN_CLIENT_VERSION: "0.0.0"
      CLIENT_DOWNLOAD_URL: "https://hts.joaogbarros.com"

  lobby:
    <<: *backend
    command: ["org.br.heretoslay.lobby.LobbyApplication"]

  monitoring:
    <<: *backend
    command: ["org.br.heretoslay.streams.monitoring.GameMonitoringStreamsProcessor"]

  nginx-lb:
    image: nginx:1.27-alpine
    container_name: game-load-balancer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8889:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
    networks:
      - kafka-network

networks:
  kafka-network:
    driver: bridge
