services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: local-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETAIN_CHECK_INTERVAL_MS: 5000
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 1

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: kafka-init
    depends_on:
      - kafka
    command: >
      bash -c "
      echo 'Aguardando Kafka subir...'
      kafka-topics.sh --bootstrap-server kafka:29092 --list
      
      echo 'Criando tópicos...'
      kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic lobby-actions-in --partitions 1 --replication-factor 1
      kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic lobby-state-out --partitions 1 --replication-factor 1
      kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic game-state-out --partitions 1 --replication-factor 1
      
      kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic lobby-state-store --partitions 1 --replication-factor 1 --config cleanup.policy=compact
      kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic match-state-store --partitions 1 --replication-factor 1 --config cleanup.policy=compact
      
      echo 'Tópicos configurados com sucesso!'"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-local
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=HereToSlay-Cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
    depends_on:
      - kafka

  game-engine:
    build:
      context: ./backend
      dockerfile: Dockerfile.engine
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - kafka
    deploy:
      replicas: 3

  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile.gateway
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - kafka
    deploy:
      replicas: 2

  nginx-lb:
    image: nginx:latest
    container_name: game-load-balancer
    ports:
      - "8887:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway

  lobby:
    build:
      context: ./backend
      dockerfile: Dockerfile.lobby
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - kafka
    deploy:
      replicas: 2

volumes:
  kafka_data:
    driver: local