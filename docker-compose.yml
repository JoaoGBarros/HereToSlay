services:
  kafka-broker-1:
    image: apache/kafka:3.7.0
    container_name: kafka-broker-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker-1:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker-1:9093,2@kafka-broker-2:9093,3@kafka-broker-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_RETAIN_CHECK_INTERVAL_MS: 5000
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 1
    networks:
      - kafka-network

  kafka-broker-2:
    image: apache/kafka:3.7.0
    container_name: kafka-broker-2
    ports:
      - "9093:9092"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker-2:29092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker-1:9093,2@kafka-broker-2:9093,3@kafka-broker-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_RETAIN_CHECK_INTERVAL_MS: 5000
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 1
    networks:
      - kafka-network
    depends_on:
      - kafka-broker-1

  kafka-broker-3:
    image: apache/kafka:3.7.0
    container_name: kafka-broker-3
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker-3:29092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker-1:9093,2@kafka-broker-2:9093,3@kafka-broker-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_RETAIN_CHECK_INTERVAL_MS: 5000
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 1
    networks:
      - kafka-network
    depends_on:
      - kafka-broker-1

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: kafka-init
    depends_on:
      - kafka-broker-1
      - kafka-broker-2
      - kafka-broker-3
    command: >
      bash -c "
      echo 'Aguardando Kafka cluster subir...'
      sleep 10
      kafka-topics.sh --bootstrap-server kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092 --list
      
      echo 'Criando tópicos com 3 replicas...'
      kafka-topics.sh --bootstrap-server kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092 --create --if-not-exists --topic lobby-actions-in --partitions 3 --replication-factor 3
      kafka-topics.sh --bootstrap-server kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092 --create --if-not-exists --topic lobby-state-out --partitions 3 --replication-factor 3
      kafka-topics.sh --bootstrap-server kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092 --create --if-not-exists --topic game-actions-in --partitions 3 --replication-factor 3
      kafka-topics.sh --bootstrap-server kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092 --create --if-not-exists --topic game-state-out --partitions 3 --replication-factor 3
      
      kafka-topics.sh --bootstrap-server kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092 --create --if-not-exists --topic lobby-state-store --partitions 3 --replication-factor 3 --config cleanup.policy=compact
      kafka-topics.sh --bootstrap-server kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092 --create --if-not-exists --topic match-state-store --partitions 3 --replication-factor 3 --config cleanup.policy=compact
      
      echo 'Tópicos configurados com sucesso!'"
    networks:
      - kafka-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-local
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=HereToSlay-Cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092
    depends_on:
      - kafka-broker-1
      - kafka-broker-2
      - kafka-broker-3
    networks:
      - kafka-network

  game-engine:
    build:
      context: ./backend
      dockerfile: Dockerfile.engine
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092
    depends_on:
      - kafka-broker-1
      - kafka-broker-2
      - kafka-broker-3
      - kafka-init
    deploy:
      replicas: 3
    networks:
      - kafka-network

  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile.gateway
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092
    depends_on:
      - kafka-init
    deploy:
      replicas: 1
    networks:
      - kafka-network

  nginx-lb:
     image: nginx:latest
     container_name: game-load-balancer
     ports:
       - "8887:80"
     volumes:
       - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
     depends_on:
       - gateway
     networks:
       - kafka-network

  lobby:
    build:
      context: ./backend
      dockerfile: Dockerfile.lobby
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092
    depends_on:
      - kafka-broker-1
      - kafka-broker-2
      - kafka-broker-3
      - kafka-init
    deploy:
      replicas: 2
    networks:
      - kafka-network

volumes:
  kafka_data:
    driver: local

networks:
  kafka-network:
    driver: bridge

